const list = document.getElementById('songs');
const count = document.getElementById('count');
function render(){
  const q=search.value.trim().toLocaleLowerCase('de');
  const filtered=songs.filter(s=>(s.artist+' '+s.title).toLocaleLowerCase('de').includes(q));
  count.textContent=filtered.length+' von '+songs.length+' Songs';
  list.replaceChildren();
  if(!filtered.length){const e=document.createElement('div');e.className='empty';e.textContent='Keine Songs gefunden';list.append(e);return;}
  const frag=document.createDocumentFragment();
  for(const s of filtered){
    const item=document.createElement('div');item.className='song';
    const title=document.createElement('div');title.className='title';title.textContent=s.title;
    const artist=document.createElement('div');artist.className='artist';artist.textContent=s.artist;
    item.append(title,artist);frag.append(item);
  }
  list.append(frag);
}
search.addEventListener('input',render);
